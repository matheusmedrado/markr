[package]
name = "markr"
version = "0.1.0"
edition = "2024"
description = "A polished Markdown workspace for the terminal"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
pulldown-cmark = "0.9"
ratatui = "0.29"
unicode-width = "0.2"

[dev-dependencies]
pretty_assertions = "1.4"
