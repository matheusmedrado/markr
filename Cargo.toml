[package]
name = "markr"
version = "0.1.0"
edition = "2024"
description = "A polished Markdown workspace for the terminal"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
pulldown-cmark = "0.9"
ratatui = "0.30.2"
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm", "image-defaults"] }
syntect = "5.2"
arboard = "3.4"
unicode-width = "0.2"
unicode-segmentation = "1.12"

[dev-dependencies]
pretty_assertions = "1.4"

# `cargo run` is what the README tells people to use, and a fully unoptimised
# syntect and image make the reader feel slow for no good reason. Dependencies
# are built once at full optimisation; this crate keeps a light setting so its
# own builds stay quick and debuggable.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
